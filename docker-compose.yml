version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: botlace
      POSTGRES_USER: botlace
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botlace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: botlace
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}

  backend-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.gateway
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://botlace:${DB_PASSWORD:-changeme}@postgres:5432/botlace
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://botlace:${MONGO_PASSWORD:-changeme}@mongodb:27017/botlace?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-changeme}
      FHIR_SERVER_URL: ${FHIR_SERVER_URL:-http://fhir-server:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  acre-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.acre
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://botlace:${DB_PASSWORD:-changeme}@postgres:5432/botlace
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://botlace:${MONGO_PASSWORD:-changeme}@mongodb:27017/botlace?authSource=admin
    depends_on:
      - postgres
      - redis
      - mongodb
    volumes:
      - ./backend:/app
      - ./ai/models:/app/models
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  mongo_data:
